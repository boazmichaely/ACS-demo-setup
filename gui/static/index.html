<!DOCTYPE html>
<html lang="en" class="pf-v6-theme-felt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACS demo setup</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@patternfly/patternfly@6.6.0/patternfly.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@patternfly/patternfly@6.6.0/patternfly-addons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=content_copy,done,open_in_new"
    />
    <link rel="stylesheet" href="/static/demo-setup.css?v=shell22" />
  </head>
  <body>
    <div class="pf-v6-c-page pf-m-no-sidebar" id="page">
      <header class="pf-v6-c-masthead" id="page-masthead">
        <div class="pf-v6-c-masthead__main">
          <div class="pf-v6-c-masthead__brand">
            <a class="demo-mh-brand" href="/" aria-label="ACS demo setup home">
              <img
                class="demo-mh-logo"
                src="/static/favicon.png"
                width="32"
                height="32"
                alt=""
              />
              <span class="demo-mh-title">ACS demo setup</span>
            </a>
          </div>
        </div>
        <div class="pf-v6-c-masthead__content">
          <div class="pf-v6-c-toolbar pf-m-full-height">
            <div class="pf-v6-c-toolbar__content">
              <div class="pf-v6-c-toolbar__content-section">
                <div class="pf-v6-c-toolbar__group pf-m-align-end pf-m-gap-md">
                  <div class="pf-v6-c-toolbar__item">
                    <div class="demo-mh-lab">
                      <span class="demo-mh-lab__label">Active lab</span>
                      <label class="demo-sr-only" for="activeLabSelect"
                        >Active lab for modules</label
                      >
                      <select
                        id="activeLabSelect"
                        class="pf-v6-c-form-control"
                        aria-label="Active lab for modules"
                      ></select>
                    </div>
                  </div>
                  <div class="pf-v6-c-toolbar__item">
                    <div class="pf-v6-c-toggle-group" role="group" aria-label="Color scheme">
                      <div class="pf-v6-c-toggle-group__item">
                        <button
                          type="button"
                          class="pf-v6-c-toggle-group__button"
                          data-theme-choice="light"
                          aria-pressed="false"
                        >
                          Light
                        </button>
                      </div>
                      <div class="pf-v6-c-toggle-group__item">
                        <button
                          type="button"
                          class="pf-v6-c-toggle-group__button"
                          data-theme-choice="dark"
                          aria-pressed="false"
                        >
                          Dark
                        </button>
                      </div>
                      <div class="pf-v6-c-toggle-group__item">
                        <button
                          type="button"
                          class="pf-v6-c-toggle-group__button"
                          data-theme-choice="system"
                          aria-pressed="true"
                        >
                          System
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="pf-v6-c-page__main-container pf-m-fill">
        <main class="pf-v6-c-page__main" tabindex="-1" id="main-content">
          <section class="pf-v6-c-page__main-section">
            <div class="pf-v6-c-page__main-body demo-pad">
              <details class="demo-cred" id="credPanel">
                <summary class="demo-cred__summary">
                  <span class="demo-cred__chev" aria-hidden="true"></span>
                  <span class="demo-cred__title">Lab credentials</span>
                </summary>
                <div class="demo-cred__body">
                  <div
                    class="pf-v6-c-alert pf-m-warning pf-m-inline"
                    id="credDualMismatch"
                    hidden
                    role="alert"
                    aria-label="Warning"
                  >
                    <div class="pf-v6-c-alert__icon">
                      <svg
                        class="pf-v6-svg"
                        fill="currentColor"
                        viewBox="0 0 32 32"
                        aria-hidden="true"
                        role="img"
                        width="1em"
                        height="1em"
                      >
                        <path
                          d="m31.874 28.514-15.011-27a1.001 1.001 0 0 0-1.748 0l-15.011 27A1 1 0 0 0 .978 30H31a1 1 0 0 0 .874-1.486ZM14.5 12a1.5 1.5 0 0 1 3 0v5a1.5 1.5 0 0 1-3 0v-5ZM16 26.001a2 2 0 1 1-.001-3.999A2 2 0 0 1 16 26.001Z"
                        />
                      </svg>
                    </div>
                    <p class="pf-v6-c-alert__title">
                      <span class="pf-v6-screen-reader">Warning:</span>
                      You are editing the active lab.
                    </p>
                  </div>

                  <div class="demo-cred-top">
                    <p class="demo-cred-path" id="credPathLine">
                      <span>File:</span>
                      <code id="credFilePath">—</code>
                    </p>
                    <span id="credSaveFeedback" class="demo-cred-feedback" aria-live="polite"></span>
                    <div class="demo-cred-top__actions">
                      <button
                        class="pf-v6-c-button pf-m-secondary pf-m-small"
                        type="button"
                        id="btnCredCancel"
                        title="Discard edits and reload from file"
                      >
                        Cancel
                      </button>
                      <button
                        class="pf-v6-c-button pf-m-primary pf-m-small"
                        type="button"
                        id="btnCredSave"
                      >
                        Save
                      </button>
                    </div>
                  </div>

                  <form id="credForm" class="demo-cred-form" autocomplete="off">
                    <div class="demo-lab-toolbar">
                      <label class="demo-lab-toolbar__lab">
                        <span class="demo-lab-toolbar__label">Edit</span>
                        <select
                          id="editLabSelect"
                          class="pf-v6-c-form-control"
                          aria-label="Lab to edit"
                        ></select>
                      </label>
                      <label class="demo-lab-toolbar__name">
                        <span class="demo-lab-toolbar__label">Name</span>
                        <input
                          class="pf-v6-c-form-control"
                          type="text"
                          id="labName"
                          spellcheck="false"
                        />
                      </label>
                      <div class="demo-lab-toolbar__actions">
                        <button type="button" class="pf-v6-c-button pf-m-secondary" id="btnAddLab">
                          Add
                        </button>
                        <button
                          type="button"
                          class="pf-v6-c-button pf-m-secondary"
                          id="btnMakeActive"
                          title="Use the lab being edited as the active lab for modules"
                        >
                          Use as active
                        </button>
                        <button
                          type="button"
                          class="pf-v6-c-button pf-m-danger"
                          id="btnDeleteLab"
                          title="Delete the lab being edited"
                        >
                          Delete
                        </button>
                      </div>
                      <label class="pf-v6-c-check demo-lab-toolbar__tls">
                        <input
                          class="pf-v6-c-check__input"
                          type="checkbox"
                          id="insecureSkipTlsVerify"
                        />
                        <span class="pf-v6-c-check__label">Skip TLS</span>
                      </label>
                    </div>

                    <details class="demo-fold" id="centralFold">
                      <summary class="demo-fold__summary">
                        <span class="demo-fold__chev" aria-hidden="true"></span>
                        <span class="demo-fold__title">Central</span>
                        <span class="demo-fold__meta" id="centralFoldMeta"></span>
                      </summary>
                      <div class="demo-fold__body">
                        <div class="demo-central-cols">
                          <div class="demo-sub">
                            <h3 class="demo-sub__title">OpenShift</h3>
                            <label class="demo-field">
                              <span>Console URL</span>
                              <input
                                class="pf-v6-c-form-control"
                                id="centralOcpConsole"
                                type="url"
                                spellcheck="false"
                              />
                            </label>
                            <div class="demo-field-row">
                              <label class="demo-field">
                                <span>User</span>
                                <input
                                  class="pf-v6-c-form-control"
                                  id="centralOcpUser"
                                  type="text"
                                  spellcheck="false"
                                />
                              </label>
                              <label class="demo-field">
                                <span>Password</span>
                                <input
                                  class="pf-v6-c-form-control"
                                  id="centralOcpPassword"
                                  type="text"
                                  spellcheck="false"
                                  autocomplete="off"
                                  placeholder="Optional if using oc login"
                                />
                              </label>
                            </div>
                          </div>
                          <div class="demo-sub">
                            <h3 class="demo-sub__title">RHACS Central</h3>
                            <label class="demo-field">
                              <span>Console URL</span>
                              <input
                                class="pf-v6-c-form-control"
                                id="centralConsole"
                                type="url"
                                spellcheck="false"
                                placeholder="https://central-stackrox.apps…"
                              />
                            </label>
                            <label class="demo-field">
                              <span>API token</span>
                              <input
                                class="pf-v6-c-form-control"
                                id="centralApiToken"
                                type="text"
                                spellcheck="false"
                                autocomplete="off"
                              />
                            </label>
                            <div class="demo-field-row">
                              <label class="demo-field">
                                <span>Token name</span>
                                <input
                                  class="pf-v6-c-form-control"
                                  id="centralApiTokenName"
                                  type="text"
                                  placeholder="e.g. Cursor-exp-2026-12-31"
                                />
                              </label>
                              <label class="demo-field">
                                <span>Expires</span>
                                <input
                                  class="pf-v6-c-form-control"
                                  id="centralApiTokenExpires"
                                  type="text"
                                  placeholder="YYYY-MM-DD"
                                />
                              </label>
                            </div>
                            <div class="demo-field-row">
                              <label class="demo-field">
                                <span>Admin user</span>
                                <input
                                  class="pf-v6-c-form-control"
                                  id="centralAdminUser"
                                  type="text"
                                  spellcheck="false"
                                />
                              </label>
                              <label class="demo-field">
                                <span>Admin password</span>
                                <input
                                  class="pf-v6-c-form-control"
                                  id="centralAdminPassword"
                                  type="text"
                                  spellcheck="false"
                                  autocomplete="off"
                                />
                              </label>
                            </div>
                            <fieldset class="demo-auth-pref">
                              <label class="pf-v6-c-radio">
                                <input
                                  class="pf-v6-c-radio__input"
                                  type="radio"
                                  name="authPreference"
                                  value="apiToken"
                                  checked
                                />
                                <span class="pf-v6-c-radio__label">Prefer API token</span>
                              </label>
                              <label class="pf-v6-c-radio">
                                <input
                                  class="pf-v6-c-radio__input"
                                  type="radio"
                                  name="authPreference"
                                  value="password"
                                />
                                <span class="pf-v6-c-radio__label">Prefer admin password</span>
                              </label>
                            </fieldset>
                          </div>
                        </div>
                      </div>
                    </details>

                    <details class="demo-fold" id="scFold" open>
                      <summary class="demo-fold__summary">
                        <span class="demo-fold__chev" aria-hidden="true"></span>
                        <span class="demo-fold__title">Secured clusters</span>
                        <span class="demo-fold__meta" id="scFoldMeta"></span>
                        <button
                          type="button"
                          class="pf-v6-c-button pf-m-secondary pf-m-small"
                          id="btnAddSecuredCluster"
                          onclick="event.preventDefault(); event.stopPropagation();"
                        >
                          Add
                        </button>
                      </summary>
                      <div class="demo-fold__body">
                        <div id="securedClusterList" class="demo-sc-list"></div>
                      </div>
                    </details>
                  </form>
                </div>
              </details>

              <div class="pf-v6-c-card pf-m-compact demo-workbench">
                <div class="pf-v6-c-card__header">
                  <div class="pf-v6-c-card__title">
                    <h2 class="pf-v6-c-card__title-text">Modules</h2>
                  </div>
                </div>
                <div class="pf-v6-c-card__body">
                  <div class="demo-bulk" id="moduleBulkBar" aria-label="Module selection">
                    <label class="pf-v6-c-check" for="modSelectAll">
                      <input
                        class="pf-v6-c-check__input"
                        type="checkbox"
                        id="modSelectAll"
                        name="select-all-modules"
                      />
                      <span class="pf-v6-c-check__label">Select all</span>
                    </label>
                    <label class="demo-dry-toggle" id="dryToggleWrap" for="dryRunToggle">
                      <input
                        class="pf-v6-c-check__input"
                        type="checkbox"
                        id="dryRunToggle"
                      />
                      <span>Dry run</span>
                    </label>
                    <div class="demo-bulk__results">
                      <span id="modSelectionCount">0 of 0 selected</span>
                      <span id="modRefreshFeedback" aria-live="polite"></span>
                    </div>
                    <div class="demo-bulk__actions">
                      <button class="pf-v6-c-button pf-m-primary" type="button" id="btnRun">
                        Run selected
                      </button>
                      <button
                        class="pf-v6-c-button pf-m-secondary pf-m-danger"
                        type="button"
                        id="btnUninstall"
                        title="Uninstall checked modules (some may refuse)"
                      >
                        Uninstall selected
                      </button>
                      <button
                        class="pf-v6-c-button pf-m-secondary"
                        type="button"
                        id="btnRunFull"
                        title="All modules in registry order"
                      >
                        Run full install
                      </button>
                    </div>
                  </div>

                  <table class="demo-modules" id="modulesTable" aria-label="Demo modules">
                    <thead>
                      <tr>
                        <th scope="col">Module</th>
                        <th scope="col">Description</th>
                        <th scope="col">State</th>
                        <th scope="col" class="demo-mod__actions">
                          <span class="pf-v6-screen-reader">Actions</span>
                        </th>
                      </tr>
                    </thead>
                    <tbody id="modulesTbody">
                      <tr>
                        <td colspan="4">Loading…</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="pf-v6-c-card pf-m-compact demo-status-card">
                <div class="pf-v6-c-card__header">
                  <div class="pf-v6-c-card__title">
                    <h2 class="pf-v6-c-card__title-text">Status</h2>
                  </div>
                  <div class="pf-v6-c-card__actions">
                    <span
                      id="statusRefreshBusy"
                      class="demo-status-refresh"
                      hidden
                      aria-hidden="true"
                    >
                      <svg
                        class="pf-v6-c-spinner pf-m-md"
                        role="progressbar"
                        viewBox="0 0 100 100"
                        aria-label="Refreshing status"
                        aria-valuetext="Refreshing"
                      >
                        <circle
                          class="pf-v6-c-spinner__path"
                          cx="50"
                          cy="50"
                          r="45"
                          fill="none"
                        ></circle>
                      </svg>
                      <span id="statusRefreshIndicator" aria-live="polite">Refreshing status…</span>
                    </span>
                    <button
                      class="pf-v6-c-button pf-m-link"
                      type="button"
                      id="btnStatus"
                      title="Refresh all module status rows"
                    >
                      Refresh status
                    </button>
                    <button
                      type="button"
                      id="btnPreflightExpandAll"
                      class="pf-v6-c-button pf-m-link"
                      disabled
                      aria-label="Expand all modules"
                    >
                      Expand all
                    </button>
                  </div>
                </div>
                <div
                  id="statusRefreshProgress"
                  class="demo-status-progress"
                  hidden
                  aria-hidden="true"
                >
                  <div
                    class="pf-v6-c-progress pf-m-sm"
                    id="statusRefreshProgressBar"
                    role="progressbar"
                    aria-label="Status refresh in progress"
                    aria-valuetext="Refreshing"
                  >
                    <div class="pf-v6-c-progress__bar">
                      <div class="pf-v6-c-progress__indicator demo-status-progress__indicator"></div>
                    </div>
                  </div>
                </div>
                <div class="pf-v6-c-card__body">
                  <details id="statusOuter" class="demo-status-outer" open>
                    <summary class="demo-status-outer__toggle">
                      <span class="demo-status-outer__chev" aria-hidden="true"></span>
                      <span class="demo-status-outer__title">Modules</span>
                      <span class="demo-status-outer__meta" id="statusPanelMeta"></span>
                    </summary>
                    <div id="statusWrap" class="demo-status-body"></div>
                  </details>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="demo-log-drawer" id="logDrawer">
      <button
        type="button"
        class="demo-log-drawer__bar"
        id="logDrawerToggle"
        aria-expanded="false"
        aria-controls="logDrawerPanel"
      >
        <span class="demo-log-drawer__chev" aria-hidden="true"></span>
        <span class="demo-log-drawer__title">Log</span>
        <span class="demo-log-drawer__preview" id="logDrawerPreview">Session console</span>
      </button>
      <div class="demo-log-drawer__panel" id="logDrawerPanel">
        <div id="log" role="log" aria-label="Script output"></div>
      </div>
    </div>

    <script>
      (function () {
        var KEY = "acs-demo-setup-theme";
        var root = document.documentElement;
        var buttons = document.querySelectorAll("[data-theme-choice]");
        function systemDark() {
          return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        function apply(choice) {
          var dark = choice === "dark" || (choice === "system" && systemDark());
          root.classList.toggle("pf-v6-theme-dark", dark);
          buttons.forEach(function (btn) {
            btn.setAttribute(
              "aria-pressed",
              btn.getAttribute("data-theme-choice") === choice ? "true" : "false"
            );
          });
        }
        var stored = localStorage.getItem(KEY) || "system";
        apply(stored);
        buttons.forEach(function (btn) {
          btn.addEventListener("click", function () {
            var choice = btn.getAttribute("data-theme-choice");
            localStorage.setItem(KEY, choice);
            apply(choice);
          });
        });
        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
            if ((localStorage.getItem(KEY) || "system") === "system") apply("system");
          });
        }
        var drawer = document.getElementById("logDrawer");
        var toggle = document.getElementById("logDrawerToggle");
        var preview = document.getElementById("logDrawerPreview");
        var logEl = document.getElementById("log");
        toggle.addEventListener("click", function () {
          var open = drawer.classList.toggle("is-open");
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
        });
        var obs = new MutationObserver(function () {
          var text =
            (logEl.textContent || "").trim().split("\n").filter(Boolean).pop() || "Session console";
          preview.textContent = text.slice(0, 120);
        });
        obs.observe(logEl, { childList: true, characterData: true, subtree: true });
      })();
    </script>
    <script src="/static/app.js?v=shell22" type="module"></script>
  </body>
</html>
